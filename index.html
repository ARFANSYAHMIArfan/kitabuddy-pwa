    <style>
      body {
        font-family: 'Nunito', sans-serif;
        background-color: #FDFBF7; /* Aesthetic Warm Cream */
        color: #3D405B;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Fredoka', sans-serif;
      }
      
      /* Modern Abstract Background Pattern - Made sharper */
      .bg-aesthetic-pattern {
        background-color: #FDFBF7;
        background-image: radial-gradient(#E07A5F 0.8px, transparent 0.8px), radial-gradient(#81B29A 0.8px, #FDFBF7 0.8px);
        background-size: 24px 24px;
        background-position: 0 0, 12px 12px;
        opacity: 0.8;
      }

      /* Custom scrollbar for chat */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      
      /* Changed from Glass to Solid Clean Card for Clarity */
      .glass-panel {
        background: #FFFFFF;
        border: 1px solid rgba(0, 0, 0, 0.05);
      }
